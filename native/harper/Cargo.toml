[package]
name = "localharper"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# tools/build_harper.py extracts these crates from the verified upstream commit.
harper-core = { path = "../../build/harper/upstream/harper-core", default-features = false, features = ["concurrent"] }
jni = "=0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
lto = false
codegen-units = 8
panic = "unwind"
strip = "debuginfo"
